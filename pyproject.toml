[project]
name = "socratease"
version = "0.2.0"
description = "SocratEase - AI-powered speech analysis and practice platform"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Web framework
    "Flask==3.1.0",
    "flask-cors==5.0.1",
    "gunicorn==23.0.0",
    # Environment & config
    "python-dotenv==1.2.1",
    # AWS
    "boto3==1.34.69",
    # Audio/ML
    "openai-whisper==20250625",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "soundfile==0.13.1",
    "sounddevice==0.5.3",
    # Vision
    "mediapipe==0.10.21",
    "opencv-python==4.11.0.86",
    "opencv-contrib-python==4.11.0.86",
    "Pillow==10.2.0",
    "dlib==19.24.6",
    "deepface==0.0.93",
    "tf-keras",
    # NLP/ML
    "transformers==4.57.3",
    "numpy==1.26.4",
    # TTS
    "pyneuphonic==1.8.8",
    # Scheduling
    "APScheduler==3.11.0",
]
